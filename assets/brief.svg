<text x="32" y="44" font-size="13" class="s" letter-spacing="2">MISSION BRIEF</text><text x="32" y="72" font-size="14" class="v">QA Engineer in the core banking (ABS) team at UZUM Technologies x Kapitalbank: payment flows, SWIFT</text><text x="32" y="94" font-size="14" class="v">messaging, backend checks in SQL / PL/SQL, API testing in Postman. School 21 graduate (Business Systems</text><text x="32" y="116" font-size="14" class="v">Analyst), MIS at Webster University, GPA 3.9/4.0. Before software I built drones and a student</text><text x="32" y="138" font-size="14" class="v">satellite that reached 45 km.</text><text x="32" y="182" font-size="13" class="s" letter-spacing="2">ONBOARD SYSTEMS</text><text x="32" y="234" font-size="13" class="k">Testing</text><rect x="152.0" y="217" width="45.4" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.03" stroke="#26305e"/><text x="174.7" y="234" font-size="13" text-anchor="middle" class="v">Web</text><rect x="205.4" y="217" width="45.4" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.03" stroke="#26305e"/><text x="228.1" y="234" font-size="13" text-anchor="middle" class="v">API</text><rect x="258.8" y="217" width="115.6" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.03" stroke="#26305e"/><text x="316.6" y="234" font-size="13" text-anchor="middle" class="v">Backend / DB</text><rect x="382.4" y="217" width="100.0" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.03" stroke="#26305e"/><text x="432.4" y="234" font-size="13" text-anchor="middle" class="v">Regression</text><rect x="490.4" y="217" width="107.8" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.03" stroke="#26305e"/><text x="544.3" y="234" font-size="13" text-anchor="middle" class="v">Test design</text><rect x="606.2" y="217" width="107.8" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.03" stroke="#26305e"/><text x="660.1" y="234" font-size="13" text-anchor="middle" class="v">Bug reports</text><text x="32" y="268" font-size="13" class="k">